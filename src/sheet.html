<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cheat sheet renderer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#EEF1F6;color:#1B2440;font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.45}
#stage{width:1200px}
/* ===== cheat sheet (fixed light poster) ===== */
.cs{width:1200px;padding:44px 40px 48px;display:flex;flex-direction:column;gap:30px;color:#1B2440;font-family:'Nunito',sans-serif;line-height:1.4;
  background-color:#F1F4F8;background-image:linear-gradient(rgba(52,82,199,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(52,82,199,.06) 1px,transparent 1px);background-size:24px 24px}
.cs *{box-sizing:border-box}
.cs p,.cs h1,.cs h2,.cs h3,.cs ul{margin:0}
.cs-hl{background:linear-gradient(180deg,transparent 56%,var(--h) 56%,var(--h) 94%,transparent 94%);padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cs-nw{white-space:nowrap}
.cs-head{display:flex;flex-direction:column;gap:22px}
.cs-hrow{display:flex;align-items:center;gap:28px}
.cs-sticky{position:relative;width:196px;flex-shrink:0;padding:24px 18px 20px;background:#FFD27A;box-shadow:0 10px 18px -12px rgba(27,36,64,.45);transform:rotate(-4deg);font-family:'Kalam',cursive;font-weight:700;font-size:22px;line-height:1.25}
.cs-tape{position:absolute;top:-11px;left:50%;width:74px;height:22px;margin-left:-37px;background:rgba(255,255,255,.62);border:1px solid rgba(27,36,64,.08);transform:rotate(3deg);box-shadow:0 1px 2px rgba(27,36,64,.08)}
.cs-center{flex-grow:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.cs-kicker{font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#43506B}
.cs-h1{font-family:'Kalam',cursive;font-weight:700;font-size:60px;line-height:1.08}
.cs-bigpill{display:inline-block;margin-top:6px;transform:rotate(-1.5deg);font-family:'Kalam',cursive;font-weight:700;font-size:34px;line-height:1.1;background:#FFB9A6;padding:4px 18px;border:2px solid #1B2440;border-radius:999px;box-shadow:3px 3px 0 #1B2440}
.cs-note{width:230px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.cs-note p{font-family:'Kalam',cursive;font-size:20px;line-height:1.3;transform:rotate(3deg)}
.cs-intro{margin:0 auto!important;max-width:980px;text-align:center;font-weight:600;font-size:19px;line-height:1.55;color:#2A3350}
.cs-card{background:#FFFFFF;border:1px solid #DCE2EC;border-radius:18px;box-shadow:0 1px 0 rgba(27,36,64,.04),0 16px 30px -22px rgba(27,36,64,.45)}
.cs-ov{display:flex;flex-direction:column;gap:14px;padding:22px 24px 24px}
.cs-ovtop{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.cs-h2{font-family:'Kalam',cursive;font-weight:700;font-size:28px;line-height:1.1}
.cs-legend{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;color:#43506B}
.cs-ov svg text{font-family:'Patrick Hand',cursive}
.cs-ov svg text.s{font-family:'Nunito',sans-serif;font-weight:800}
.cs-ov svg text.k{font-family:'Kalam',cursive;font-weight:700}
.cs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.cs-panel{display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #DCE2EC;border-radius:18px;overflow:hidden;box-shadow:0 1px 0 rgba(27,36,64,.04),0 16px 30px -22px rgba(27,36,64,.45)}
.cs-ph{display:flex;align-items:center;gap:14px;padding:14px 18px 13px;border-bottom:1px solid #E3E8F0}
.cs-badge{width:40px;height:40px;flex-shrink:0;border:2.5px solid #1B2440;border-radius:12px;transform:rotate(-4deg);box-shadow:2px 2px 0 #1B2440;display:flex;align-items:center;justify-content:center;font-family:'Kalam',cursive;font-weight:700;font-size:21px;line-height:1}
.cs-pt{display:flex;flex-direction:column;min-width:0}
.cs-ptitle{font-family:'Kalam',cursive;font-weight:700;font-size:22px;line-height:1.15;text-wrap:balance}
.cs-tag{font-family:'Patrick Hand',cursive;font-size:18px;line-height:1.2;color:#43506B}
.cs-pb{display:flex;flex-direction:column;gap:14px;padding:16px 18px 18px;flex-grow:1}
.cs-tile{padding:10px 6px;background-color:#F8FAFC;background-image:radial-gradient(rgba(27,36,64,.10) 1px,transparent 1.3px);background-size:14px 14px;border:1px solid #E3E8F0;border-radius:12px}
.cs-diag{display:block;margin:0 auto;overflow:visible}
.cs-diag text{font-family:'Patrick Hand',cursive}
.cs-diag text[data-f="sans"]{font-family:'Nunito',sans-serif;font-weight:800}
.cs-bul{list-style:none;padding:0 2px;display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600;line-height:1.4;color:#2A3350;flex-grow:1}
.cs-bul li{display:flex;gap:9px;align-items:flex-start}
.cs-bul svg{flex-shrink:0;position:relative;top:2px}
.cs-foot{display:flex;flex-direction:column;gap:6px;padding:10px 2px 0;border-top:1px dashed #D9DFEA}
.cs-meters{display:flex;gap:18px;align-items:center}
.cs-meter{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#43506B}
.cs-try{font-weight:600;font-size:13.5px;line-height:1.4;color:#2A3350}
.cs-try b{font-weight:800;color:#1B2440}
.cs-take{display:flex;gap:32px;align-items:stretch;padding:28px 30px}
.cs-prin{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:18px}
.cs-prin h2{font-family:'Kalam',cursive;font-weight:700;font-size:33px;line-height:1;white-space:nowrap}
.cs-prin ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px;font-weight:600;font-size:17px;line-height:1.4;color:#2A3350}
.cs-prin li{display:flex;gap:10px;align-items:flex-start}
.cs-prin .sub{display:block;margin-top:3px;font-size:14.5px;color:#43506B}
.cs-vdiv{width:1px;flex-shrink:0;background-image:linear-gradient(180deg,#CDD5E3 50%,transparent 50%);background-size:1px 10px}
.cs-which{flex-grow:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.cs-which h3{font-family:'Kalam',cursive;font-weight:700;font-size:26px;line-height:1.1;margin-bottom:4px}
.cs-which ul{list-style:none;padding:0;display:flex;flex-direction:column}
.cs-which li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px dashed #D9DFEA}
.cs-which li:last-child{border-bottom:0}
.cs-which li>span:first-child{font-weight:600;font-size:16px;line-height:1.3;color:#2A3350}
.cs-pills{display:flex;gap:6px;flex-shrink:0}
.cs-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 3px;border:1.5px solid #1B2440;border-radius:999px;font-weight:800;font-size:14px;line-height:1;white-space:nowrap}
.cs-pill i{font-style:normal;width:20px;height:20px;border-radius:6px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-family:'Kalam',cursive;font-weight:700;font-size:13px}
.cs-quote{width:190px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center}
.cs-quote>div{position:relative;padding:26px 18px 20px;background:#FFB9A6;transform:rotate(3deg);box-shadow:0 10px 18px -12px rgba(27,36,64,.45);display:flex;flex-direction:column;gap:12px}
.cs-quote .cs-tape{transform:rotate(-5deg)}
.cs-quote .big{font-family:'Kalam',cursive;font-weight:700;font-size:24px;line-height:1.22}
.cs-quote .small{font-family:'Patrick Hand',cursive;font-size:18px;line-height:1.25;color:#43506B}
/* ----- shared by the extra layouts (deepdive, faceoff, gallery, timeline) and series ----- */
.cs-h1xl{font-size:88px;line-height:1.02}
.cs-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.cs-panel.full{width:100%}
.cs-ph.plain{padding:12px 18px 11px}
.cs-sec{display:flex;flex-direction:column;gap:14px;padding:16px 20px 20px;flex-grow:1}
.cs-lead{font-weight:600;font-size:17px;line-height:1.55;color:#2A3350}
.cs-dots{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:15.5px;line-height:1.4;color:#2A3350}
.cs-dots li{display:flex;gap:10px;align-items:flex-start}
.cs-dots li::before{content:'';flex-shrink:0;width:9px;height:9px;margin-top:6px;border-radius:50%;background:#3452C7;box-shadow:0 0 0 3px #E6EAFF}
.cs-m sup,.cs-m sub{font-size:.62em;line-height:0}
.cs-formula{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 14px;background:#FFF6E0;border:2px solid #1B2440;border-radius:14px;box-shadow:3px 3px 0 #1B2440;font-family:'Kalam',cursive;font-weight:700;font-size:34px;line-height:1.25;text-align:center}
.cs-formula div:nth-child(2){font-size:26px;color:#43506B}
.cs-legend2{display:flex;flex-direction:column;gap:7px;margin:0}
.cs-legend2 div{display:flex;gap:12px;align-items:baseline}
.cs-legend2 dt{flex-shrink:0;min-width:74px;font-family:'Kalam',cursive;font-weight:700;font-size:21px;line-height:1.2;color:#D1495B;text-align:right}
.cs-legend2 dd{margin:0;font-weight:600;font-size:15.5px;line-height:1.4;color:#2A3350}
.cs-fnote{font-family:'Patrick Hand',cursive;font-size:18px;line-height:1.3;color:#43506B}
.cs-steps{display:flex;align-items:stretch;gap:10px}
.cs-steps>svg{flex-shrink:0;align-self:center}
.cs-step{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;background:#FFFFFF;border:1.5px solid #1B2440;border-radius:12px}
.cs-step.given{background:#FFF6E0}
.cs-step h4{display:flex;align-items:center;gap:8px;margin:0;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#43506B}
.cs-step h4 i{font-style:normal;width:22px;height:22px;flex-shrink:0;border-radius:7px;border:1.5px solid #1B2440;display:inline-flex;align-items:center;justify-content:center;font-family:'Kalam',cursive;font-weight:700;font-size:14px;color:#1B2440}
.cs-step p{font-family:'Patrick Hand',cursive;font-size:20px;line-height:1.3;color:#1B2440}
.cs-result{align-self:center;font-family:'Kalam',cursive;font-weight:700;font-size:24px;line-height:1.3;text-align:center}
.cs-cap{font-weight:600;font-size:15px;line-height:1.45;color:#2A3350}
.cs-uses{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.cs-uses li{display:flex;gap:12px;align-items:flex-start}
.cs-ub{width:30px;height:30px;flex-shrink:0;border:2px solid #1B2440;border-radius:9px;transform:rotate(-4deg);display:inline-flex;align-items:center;justify-content:center;font-family:'Kalam',cursive;font-weight:700;font-size:16px}
.cs-uses b{display:block;font-weight:800;font-size:15.5px;line-height:1.3}
.cs-uses span{display:block;font-weight:600;font-size:14.5px;line-height:1.4;color:#43506B}
.cs-pc{display:flex;gap:26px;align-items:stretch}
.cs-pc>div:not(.cs-vdiv){flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
.cs-pc h3{font-family:'Kalam',cursive;font-weight:700;font-size:24px;line-height:1.1}
.cs-take2{padding:26px 30px}
.cs-prin2{flex-grow:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.cs-prin2 h2{font-family:'Kalam',cursive;font-weight:700;font-size:33px;line-height:1;white-space:nowrap}
.cs-prin2 ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font-weight:600;font-size:17px;line-height:1.4;color:#2A3350}
.cs-prin2 li{display:flex;gap:10px;align-items:flex-start}
.cs-prin2 .sub{display:block;margin-top:3px;font-size:14.5px;color:#43506B}
/* face-off */
.cs-vs{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0 4px}
.cs-vs span{font-family:'Kalam',cursive;font-weight:700;line-height:1.05}
.cs-vsa,.cs-vsb{font-size:56px;padding:4px 24px 2px;border:2.5px solid #1B2440;border-radius:18px;box-shadow:4px 4px 0 #1B2440}
.cs-vsa{background:#FFB9A6;transform:rotate(-2deg)}
.cs-vsb{background:#BCC6FF;transform:rotate(2deg)}
.cs-vsx{font-size:34px;color:#43506B}
.cs-sub{display:inline-block;margin-top:8px;font-family:'Kalam',cursive;font-weight:700;font-size:32px;line-height:1.15}
.cs-chart{display:flex;flex-direction:column;gap:12px;padding:22px 24px 22px}
.cs-tbl{padding:22px 24px 16px}
.cs-table{width:100%;border-collapse:collapse;margin-top:10px}
.cs-table th,.cs-table td{padding:10px 12px;border-bottom:1px dashed #D9DFEA;text-align:left;vertical-align:top;font-size:16px;line-height:1.4}
.cs-table tbody tr:last-child th,.cs-table tbody tr:last-child td{border-bottom:0}
.cs-table thead th{border-bottom:2px solid #1B2440;padding-bottom:10px}
.cs-table tbody th{width:24%;font-weight:800;color:#1B2440}
.cs-table td{width:38%;font-weight:600;color:#2A3350}
.cs-table td.a{background:rgba(255,241,236,.7)}
.cs-table td.b{background:rgba(239,242,255,.8)}
.cs-when{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:16px;line-height:1.4;color:#2A3350}
.cs-when li{display:flex;gap:10px;align-items:flex-start}
/* gallery */
.cs-gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
/* timeline */
.cs-tl{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:84px;row-gap:22px}
.cs-spine{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:#1B2440}
.cs-ev{position:relative;display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #DCE2EC;border-radius:18px;box-shadow:0 1px 0 rgba(27,36,64,.04),0 16px 30px -22px rgba(27,36,64,.45)}
.cs-ev>.cs-ph{border-radius:18px 18px 0 0}
.cs-ev::before{content:'';position:absolute;top:34px;width:42px;border-top:2.5px dashed #1B2440}
.cs-ev.l::before{right:-43px}
.cs-ev.r::before{left:-43px}
.cs-dot{position:absolute;top:25px;width:20px;height:20px;border-radius:50%;background:#FFD27A;border:3px solid #1B2440;z-index:1}
.cs-ev.l .cs-dot{right:-52px}
.cs-ev.r .cs-dot{left:-52px}
.cs-year{flex-shrink:0;padding:5px 12px 4px;border:2px solid #1B2440;border-radius:999px;box-shadow:2px 2px 0 #1B2440;transform:rotate(-3deg);font-family:'Kalam',cursive;font-weight:700;font-size:20px;line-height:1;white-space:nowrap}
.cs-evt{font-weight:600;font-size:15px;line-height:1.45;color:#2A3350}
.cs-evt b{font-weight:800;color:#1B2440}
.cs-themes{display:flex;flex-direction:column;gap:16px;padding:22px 24px 24px}
.cs-trow{display:flex;align-items:stretch;gap:8px}
.cs-trow>svg{flex-shrink:0;align-self:center}
.cs-th{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1.5px solid #1B2440;border-radius:12px}
.cs-th b{font-weight:800;font-size:15.5px;line-height:1.25}
.cs-th span{font-family:'Patrick Hand',cursive;font-size:17px;line-height:1.25;color:#43506B}
/* series */
.cs-ser{display:flex;align-items:center;gap:18px;padding:12px 18px;background:#FFFFFF;border:1.5px solid #1B2440;border-radius:14px;box-shadow:3px 3px 0 #1B2440}
.cs-ser-l{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.cs-ser-l b{font-family:'Kalam',cursive;font-weight:700;font-size:22px;line-height:1.1}
.cs-ser-list{list-style:none;margin:0;padding:0;flex-grow:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cs-ser-list li{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 3px;border:1.5px solid #1B2440;border-radius:999px;font-weight:800;font-size:13.5px;line-height:1;white-space:nowrap;background:#FFFFFF}
.cs-ser-list li i{font-style:normal;width:20px;height:20px;border-radius:6px;background:#F1F4F8;display:inline-flex;align-items:center;justify-content:center;font-family:'Kalam',cursive;font-weight:700;font-size:13px}
.cs-ser-list li.now{background:#FFD27A;border:2.5px solid #D1495B;font-size:14.5px;padding:4px 13px 4px 4px}
.cs-ser-list li.now i{background:#FFFFFF}
.cs-ser-list li.next{border:1.5px dashed #8C95A8;color:#8C95A8;background:transparent}
.cs-ser-r{flex-shrink:0;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#43506B}
.cs-ser-r b{font-family:'Kalam',cursive;font-size:30px;letter-spacing:0;color:#D1495B}
.cs-next{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 20px;background:#FFF6E0;border:1.5px dashed #1B2440;border-radius:14px;font-weight:600;font-size:17px;line-height:1.35;color:#2A3350}
.cs-next-k{font-family:'Kalam',cursive;font-weight:700;font-size:26px;line-height:1;color:#1B2440}
.cs-next b{font-weight:800;color:#1B2440}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* Sheet renderer extracted from Cheat Sheet Studio. Reads window.DOC = {title, concept, data}. */
(() => {
"use strict";
/* ---------- palette (from the visual-cheat-sheet skill) ---------- */
const P = {ink:'#1B2440', soft:'#43506B', body:'#2A3350', red:'#D1495B', blue:'#3452C7', gray:'#8C95A8', bar:'#C8CFDC'};
const HL = {amber:'#FFD27A', coral:'#FFB9A6', teal:'#9FE0D2', lime:'#D2EA8E', peri:'#BCC6FF', lilac:'#E3BDF4'};
const TINT = {amber:'#FFF6E0', coral:'#FFF1EC', teal:'#E9F8F4', lime:'#F6FBE6', peri:'#EFF2FF', lilac:'#FAF0FE'};
const CYCLE = ['coral','teal','lime','peri','lilac','coral','teal','lime','peri'];
const colOf = (n) => CYCLE[(n - 1) % CYCLE.length];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = (s, n) => { s = String(s ?? '').trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, Math.round(Number(v) || a)));

/* ---------- sheet renderer ---------- */
const hl = (col, html) => `<span class="cs-hl" style="--h:${HL[col]}">${html}</span>`;
const marker = (sign) => sign === '+'
  ? `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#E6EAFF" stroke="${P.blue}" stroke-width="1.4"></circle><path d="M8 4.6 L8 11.4 M4.6 8 L11.4 8" stroke="${P.blue}" stroke-width="1.8" stroke-linecap="round" fill="none"></path></svg>`
  : `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#FFE7E3" stroke="${P.red}" stroke-width="1.4"></circle><path d="M4.6 8 L11.4 8" stroke="${P.red}" stroke-width="1.8" stroke-linecap="round" fill="none"></path></svg>`;
const LEVEL = {1:'low', 2:'medium', 3:'high'};
const dots = (n, label) => {
  let c = '';
  for (let i = 0; i < 3; i++) c += i < n
    ? `<circle cx="${5 + i * 12}" cy="5" r="4" fill="${P.ink}"></circle>`
    : `<circle cx="${5 + i * 12}" cy="5" r="3.4" fill="#FFFFFF" stroke="${P.ink}" stroke-width="1.2"></circle>`;
  return `<svg width="34" height="10" viewBox="0 0 34 10" role="img" aria-label="${esc(label)}: ${LEVEL[n]}">${c}</svg>`;
};
const CHECK = `<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="flex-shrink:0;position:relative;top:2px"><rect x="2" y="2" width="16" height="16" rx="3" fill="#E9F8F4" stroke="${P.ink}" stroke-width="1.8"></rect><polyline points="5.5,10 9,13.5 15.5,6" fill="none" stroke="#1F7A5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>`;
const BULB = `<svg width="48" height="56" viewBox="0 0 64 72" aria-hidden="true" style="flex-shrink:0"><path d="M32 10 C19 10 11 19 11 30 C11 38 16 43 20 48 C22 51 23 54 23 57 L41 57 C41 54 42 51 44 48 C48 43 53 38 53 30 C53 19 45 10 32 10 Z" fill="#FFD27A" stroke="${P.ink}" stroke-width="3" stroke-linejoin="round"></path><path d="M24 63 L40 63 M26 69 L38 69" stroke="${P.ink}" stroke-width="3" stroke-linecap="round" fill="none"></path><path d="M27 44 C27 36 32 34 32 28 M37 44 C37 36 32 34 32 28" stroke="${P.ink}" stroke-width="2" fill="none" stroke-linecap="round"></path><path d="M32 1 L32 5 M6 12 L9 15 M58 12 L55 15 M1 32 L5 32 M63 32 L59 32" stroke="${P.ink}" stroke-width="3" stroke-linecap="round" fill="none"></path></svg>`;

/* overview strip as one SVG */
function head(x1, y1, x2, y2, color, sw, L = 8) {
  const g = Math.atan2(y2 - y1, x2 - x1);
  const p = [0.5, -0.5].map(d => [x2 - L * Math.cos(g + d), y2 - L * Math.sin(g + d)]);

}
const arrow = (x1, y1, x2, y2, color, sw = 1.8) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"></line>` + head(x1, y1, x2, y2, color, sw);
const rct = (x, y, w, h, fill, stroke, sw = 1.5, rx = 10, dash) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}"` : ''}${dash ? ` stroke-dasharray="${dash}"` : ''}></rect>`;
const tx = (x, y, s, size, cls, color = P.ink, anchor) => `<text x="${x}" y="${y}" font-size="${size}" fill="${color}"${cls ? ` class="${cls}"` : ''}${anchor ? ` text-anchor="${anchor}"` : ''}>${esc(s)}</text>`;
const chipW = (name) => 30 + [...String(name)].reduce((a, c) => a + (/[A-Z]/.test(c) ? 8.9 : /[0-9]/.test(c) ? 7.4 : c === ' ' ? 3.6 : /[a-z]/.test(c) ? 7.1 : 5.5), 0);
function chipSVG(x, y, it) {

    tx(x + 11, y + 15.5, String(it.n), 11, 'k', P.ink, 'middle') + tx(x + 23, y + 15.5, it.short, 12.5, 's'), w];
}
function wrapWords(s, maxChars, maxLines) {
  const words = String(s || '').split(/\s+/).filter(Boolean); const lines = []; let cur = '';
  for (const w of words) {

  if (cur) lines.push(cur);

function overviewSVG(ov, items) {
  const W = 1080, gap = 40, on = ov.online, n = on.length;
  const byN = Object.fromEntries(items.map(i => [i.n, i]));
  /* stage widths: sized to their chips (aim for at most two rows), scaled to fill the row */
  const want = on.map(st => {
    const cw = st.items.filter(k => byN[k]).map(k => chipW(byN[k].short));
    const sum = cw.reduce((x, y) => x + y, 0) + 6 * Math.max(0, cw.length - 1);
    const chipsNeed = cw.length > 2 ? Math.ceil(sum / 2) + 40 : (cw.length ? Math.max(...cw) + 24 : 0);
    return Math.max(130, String(st.name).length * 8.2 + 24, chipsNeed);
  });
  const f = (W - gap * (n - 1)) / want.reduce((x, y) => x + y, 0);
  const ws = want.map(v => v * f);
  const xs = ws.map((_, i) => ws.slice(0, i).reduce((x, y) => x + y, 0) + gap * i);
  const mid = (i) => xs[i] + ws[i] / 2;
  const loop = ov.loop && byN[ov.loop.item] && on[ov.loop.from] && on[ov.loop.to] ? ov.loop : null;
  const y0 = loop ? 44 : 22;
  const layouts = on.map((st, si) => {
    const inner = ws[si] - 24; const rows = []; let row = [], rw = 0;
    for (const num of st.items) {
      const it = byN[num]; if (!it) continue; const cw = chipW(it.short);
      if (row.length && rw + 6 + cw > inner) { rows.push(row); row = []; rw = 0; }
      row.push(it); rw += (row.length > 1 ? 6 : 0) + cw;
    }
    if (row.length) rows.push(row);
    return {rows, notes: wrapWords(st.note, Math.floor(inner / 6.3), 2)};
  });
  const h0 = Math.max(86, ...layouts.map(l => 34 + l.rows.length * 26 + l.notes.length * 17 + 10));
  let c = ov.label ? tx(0, loop ? 24 : 12, String(ov.label).toUpperCase(), 11, 's', P.soft) : '';
  if (loop) {
    const xf = mid(loop.from), xt = mid(loop.to);
    c += `<path d="M${xf} ${y0} L${xf} 16 L${xt} 16 L${xt} ${y0 - 2}" fill="none" stroke="${P.red}" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"></path>` + head(xt, 16, xt, y0 - 2, P.red, 1.8);

  on.forEach((st, i) => {
    const x = xs[i], w = ws[i], L = layouts[i];
    const fill = (!st.items.length && i === 0) ? HL.amber : (!st.items.length && i === n - 1) ? TINT.teal : '#FFFFFF';
    c += rct(x, y0, w, h0, fill, P.ink, 1.5, 10) + tx(x + 12, y0 + 22, clip(st.name, 22), 14, 's');
    L.rows.forEach((row, r) => { let cx = x + 12; for (const it of row) { const [sv, cw] = chipSVG(cx, y0 + 32 + r * 26, it); c += sv; cx += cw + 6; } });
    const ny = y0 + 34 + L.rows.length * 26 + 12;
    L.notes.forEach((ln, k) => { c += tx(x + 12, ny + k * 17, ln, 14, '', P.soft); });
    if (i < n - 1) c += arrow(x + w + 2, y0 + h0 / 2, x + w + gap - 2, y0 + h0 / 2, P.ink, 1.8);
  });
  let bottom = y0 + h0;
  const off = ov.offline;
  if (off.length) {
    const ow = Math.min(300, (W - gap * (Math.max(off.length, 3) - 1)) / Math.max(off.length + 1, 3));
    const ly = y0 + h0 + 32, y1 = y0 + h0 + 44;
    const onotes = off.map(o => wrapWords(o.note, Math.floor((ow - 24) / 6.3), 2));
    const h1 = Math.max(50, ...onotes.map(l => 30 + l.length * 17 + 4));
    c += tx(0, ly, 'ONCE, AHEAD OF TIME (OFFLINE)', 11, 's', P.soft);
    off.forEach((o, i) => {
      const x = i * (ow + gap);
      c += rct(x, y1, ow, h1, '#F8FAFC', P.gray, 1.3, 10, '5 3') + tx(x + 12, y1 + 21, clip(o.name, 22), 14, 's');
      onotes[i].forEach((ln, k) => { c += tx(x + 12, y1 + 40 + k * 17, ln, 14, '', P.soft); });

    });
    if (ov.feeds >= 0 && ov.feeds < n) {
      const xo = (off.length - 1) * (ow + gap) + ow / 2, xt = mid(ov.feeds), yt = y0 + h0 + 4, ym = (y0 + h0 + y1) / 2 + 4;
      if (Math.abs(xo - xt) < 1) c += arrow(xo, y1 - 2, xt, yt, P.blue, 1.8);

  return `<svg width="1070" height="${Math.round(H * 1070 / 1080)}" viewBox="0 0 1080 ${H}" role="img" aria-label="${esc(alt)}" style="display:block;overflow:visible">${c}</svg>`;
}

  const idea = `<section class="cs-panel">${phead(n1, col(n1), (d.idea && d.idea.title) || 'The idea', '', 'plain')}<div class="cs-sec"><p class="cs-lead">${esc(d.idea && d.idea.text)}</p>
<ul class="cs-dots">${arr(d.idea && d.idea.points).map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ul></div></section>`;
  const formula = `<section class="cs-panel">${phead(n2, col(n2), f.title || 'The formula', '', 'plain')}<div class="cs-sec"><div class="cs-formula cs-m">${arr(f.lines).map(l => `<div>${mth(l)}</div>`).join('')}</div>
<dl class="cs-legend2 cs-m">${arr(f.legend).map(x => `<div><dt>${mth(x.sym)}</dt><dd>${esc(x.text)}</dd></div>`).join('')}</dl>${f.note ? `<p class="cs-fnote">${esc(f.note)}</p>` : ''}</div></section>`;
  const steps = arr(ex.steps).map((s, i) => `${ARROW_R}<div class="cs-step"><h4><i>${i + 1}</i>${esc(s.title)}</h4>${arr(s.lines).map(l => `<p class="cs-m">${mth(l)}</p>`).join('')}</div>`).join('');
  const example = `<section class="cs-panel full">${phead(n3, col(n3), ex.title || 'Worked example', ex.tagline || '', 'plain')}<div class="cs-sec">
<div class="cs-steps"><div class="cs-step given"><h4>Given</h4>${arr(ex.given).map(l => `<p class="cs-m">${mth(l)}</p>`).join('')}</div>${steps}</div>
${ex.result ? `<p class="cs-result cs-m">${hl('amber', mth(ex.result))}</p>` : ''}</div></section>`;
  const figHTML = figs.map(fg => { const n = nx(); return `<section class="cs-panel">${phead(n, col(n), fg.title, '', 'plain')}<div class="cs-pb"><div class="cs-tile">${diagSVG(fg.key, 240, 170, 312, fg.title)}</div><p class="cs-cap">${esc(fg.caption)}</p></div></section>`; }).join('');
  const nu = nx();
  const usesHTML = `<section class="cs-panel">${phead(nu, col(nu), uses.title || 'Where it’s used', '', 'plain')}<div class="cs-sec"><ul class="cs-uses">${arr(uses.items).map((u, i) => `<li><span class="cs-ub" style="background:${HL[colOf(i + 1)]}">${String.fromCharCode(65 + i)}</span><div><b>${esc(u.name)}</b><span>${esc(u.text)}</span></div></li>`).join('')}</ul></div></section>`;
  const np = nx();
  const pc = `<section class="cs-panel full">${phead(np, col(np), 'Strengths and limits', '', 'plain')}<div class="cs-pb"><div class="cs-pc">
<div><h3>${hl('teal', 'Strengths')}</h3>${bulList(arr(d.pros).map(t => ({sign: '+', text: t})))}</div><div class="cs-vdiv" aria-hidden="true"></div>
<div><h3>${hl('coral', 'Limits')}</h3>${bulList(arr(d.cons).map(t => ({sign: '-', text: t})))}</div></div>
${arr(d.tools).length ? `<div class="cs-foot">${tryLine(d.tools)}</div>` : ''}</div></section>`;
  const fs = Math.min(88, Math.floor(600 / (0.5 * Math.max(1, String(d.title[0]).length))));
  const head = headWith(d, `<h1 class="cs-h1 cs-h1xl" style="font-size:${fs}px">${hl('amber', esc(d.title[0]))}</h1><div><span class="cs-bigpill">${esc(d.title[1])}</span></div>`);
  return `<div class="cs" lang="en" data-layout="deepdive">${seriesBar(d)}${head}
<div class="cs-g2">${idea}${formula}</div>${example}
<div class="cs-grid">${figHTML}${usesHTML}</div>${pc}${takeWide(d)}${seriesNext(d)}</div>`;
}

/* face-off: A vs B */
function faceoffHTML(d) {
  const S = arr(d.sides).slice(0, 2), C = ['coral', 'peri'], K = ['A', 'B'];
  const side = (s, i) => `<section class="cs-panel">${phead(K[i], C[i], s.name, s.tagline ? `“${s.tagline}”` : '')}<div class="cs-pb">
<div class="cs-tile">${diagSVG(i ? 'b' : 'a', 360, 170, 494, s.name)}</div>${bulList(arr(s.bullets))}${arr(s.tools).length ? `<div class="cs-foot">${tryLine(s.tools)}</div>` : ''}</div></section>`;
  const pillAB = (i) => `<span class="cs-pill" style="background:${HL[C[i]]}"><i>${K[i]}</i>${esc(S[i] ? S[i].short || S[i].name : K[i])}</span>`;
  const ch = d.chart ? `<section class="cs-card cs-chart"><h2 class="cs-h2">${hl('amber', esc(d.chart.title))}</h2><div class="cs-tile">${diagSVG('chart', 640, 200, 1056, d.chart.title)}</div>${d.chart.caption ? `<p class="cs-cap">${esc(d.chart.caption)}</p>` : ''}</section>` : '';
  const rows = arr(d.table && d.table.rows).map(r => `<tr><th>${esc(r.feature)}</th><td class="a">${esc(r.a)}</td><td class="b">${esc(r.b)}</td></tr>`).join('');
  const tbl = rows ? `<section class="cs-card cs-tbl"><h2 class="cs-h2">${hl('amber', esc((d.table && d.table.title) || 'Key differences'))}</h2><table class="cs-table"><thead><tr><th></th><th>${pillAB(0)}</th><th>${pillAB(1)}</th></tr></thead><tbody>${rows}</tbody></table></section>` : '';
  const when = (i) => `<section class="cs-panel">${phead(K[i], C[i], `Use ${S[i] ? S[i].short || S[i].name : K[i]} when…`, '', 'plain')}<div class="cs-sec"><ul class="cs-when">${arr(d.when && d.when[i ? 'b' : 'a']).map(t => `<li>${CHECK}<span>${esc(t)}</span></li>`).join('')}</ul></div></section>`;
  const vfs = Math.min(56, Math.floor(1300 / Math.max(1, String(d.title[0]).length + String(d.title[1]).length)));
  const head = headWith(d, `<div class="cs-vs" style="font-size:${vfs}px"><span class="cs-vsa" style="font-size:${vfs}px">${esc(d.title[0])}</span><span class="cs-vsx">vs</span><span class="cs-vsb" style="font-size:${vfs}px">${esc(d.title[1])}</span></div><div><span class="cs-sub">${hl('amber', esc(d.title[2]))}</span></div>`, false);
  return `<div class="cs" lang="en" data-layout="faceoff">${seriesBar(d)}${head}
<div class="cs-g2">${S.map(side).join('')}</div>${ch}${tbl}<div class="cs-g2">${when(0)}${when(1)}</div>${takeWide(d)}${seriesNext(d)}</div>`;
}

/* gallery: 6–10 variants, one diagram each */
function galleryHTML(d) {
  const T = arr(d.tiles);
  const tile = (t) => { const c = colOf(t.n); return `<section class="cs-panel">${phead(t.n, c, t.title, t.tagline ? `“${t.tagline}”` : '')}<div class="cs-pb">
<div class="cs-tile">${diagSVG(t.n, 400, 140, 494, t.title)}</div>${bulList([...(t.good ? [{sign: '+', text: t.good}] : []), ...(t.watch ? [{sign: '-', text: t.watch}] : [])])}</div></section>`; };
  return `<div class="cs" lang="en" data-layout="gallery">${seriesBar(d)}${head3(d)}
<div class="cs-gal">${T.map(tile).join('')}</div>${takeWhich(d, T)}${seriesNext(d)}</div>`;
}

/* timeline: dated milestones, zig-zag along a spine */
function timelineHTML(d) {
  const E = arr(d.events);
  const ev = E.map((e, i) => { const c = colOf(e.n); return `<article class="cs-ev ${i % 2 ? 'r' : 'l'}" style="grid-column:${i % 2 + 1};grid-row:${i + 1} / span 2">
<div class="cs-ph" style="background:${TINT[c]}"><span class="cs-year" style="background:${HL[c]}">${esc(e.when)}</span><div class="cs-pt"><h2 class="cs-ptitle">${esc(e.name)}</h2>${e.by ? `<p class="cs-tag">${esc(e.by)}</p>` : ''}</div></div>
<div class="cs-pb"><div class="cs-tile">${diagSVG(e.n, 360, 120, 466, e.name)}</div><p class="cs-evt"><b>New: </b>${esc(e.what)}</p><p class="cs-evt"><b>Why it mattered: </b>${esc(e.why)}</p></div><span class="cs-dot" aria-hidden="true"></span></article>`; }).join('');
  const th = arr(d.themes);
  const themes = th.length ? `<section class="cs-card cs-themes"><h2 class="cs-h2">${hl('amber', esc(d.themes_title || 'What kept changing'))}</h2>
<div class="cs-trow">${th.map((t, i) => `${i ? ARROW_R : ''}<div class="cs-th" style="background:${TINT[colOf(i + 1)]}"><b>${esc(t.name)}</b><span>${esc(t.note)}</span></div>`).join('')}</div></section>` : '';
  return `<div class="cs" lang="en" data-layout="timeline">${seriesBar(d)}${head3(d)}
<section class="cs-tl"><div class="cs-spine" aria-hidden="true"></div>${ev}</section>${themes}${takeWide(d)}${seriesNext(d)}</div>`;
}

function sheetHTML(d) {
  const L = layoutOf(d);
  if (L === 'deepdive') return deepdiveHTML(d);
  if (L === 'faceoff') return faceoffHTML(d);
  if (L === 'gallery') return galleryHTML(d);
  if (L === 'timeline') return timelineHTML(d);
  if (d.series) return compareHTML(d).replace('<div class="cs" lang="en">', '<div class="cs" lang="en">' + seriesBar(d)).replace(/<\/div>\s*$/, seriesNext(d) + '</div>');
  return compareHTML(d);
}

/* ---------- SVG sanitizer for Claude-drawn diagrams ---------- */
const SVG_NS = 'http://www.w3.org/2000/svg';
const OK_EL = new Set(['g','rect','circle','ellipse','line','polyline','polygon','path','text','tspan']);
const OK_AT = new Set(['x','y','x1','y1','x2','y2','cx','cy','r','rx','ry','width','height','d','points','fill','stroke','stroke-width',
  'stroke-dasharray','stroke-linecap','stroke-linejoin','opacity','fill-opacity','stroke-opacity','font-size','font-weight','font-style',
  'text-anchor','dominant-baseline','transform','letter-spacing','dx','dy','data-f']);
function mountDiagram(svgEl, markup) {
  if (!svgEl || typeof markup !== 'string' || !markup.trim()) return false;
  let src = markup.replace(/<\/?svg[^>]*>/gi, '').replace(/&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-f]+;)/gi, '&amp;');
  const doc = new DOMParser().parseFromString(`<svg xmlns="${SVG_NS}">${src}</svg>`, 'image/svg+xml');
  if (doc.getElementsByTagName('parsererror').length) return false;
  let count = 0;
  const walk = (from, to) => {
    for (const node of Array.from(from.childNodes)) {
      if (node.nodeType === 3) { if (to.localName === 'text' || to.localName === 'tspan') to.appendChild(document.createTextNode(node.nodeValue)); continue; }
      if (node.nodeType !== 1 || !OK_EL.has(node.localName) || ++count > 400) continue;
      const el = document.createElementNS(SVG_NS, node.localName);
      for (const a of Array.from(node.attributes)) {
        if (!OK_AT.has(a.name)) continue;
        const v = a.value;
        if (v.length > 4000 || /url\s*\(|javascript:|expression|[<>]/i.test(v)) continue;
        el.setAttribute(a.name, v);
      }
      walk(node, el); to.appendChild(el);
    }
  };
  const frag = document.createElementNS(SVG_NS, 'g');
  walk(doc.documentElement, frag);
  if (!frag.childNodes.length) return false;
  svgEl.textContent = '';
  while (frag.firstChild) svgEl.appendChild(frag.firstChild);
  fitDiagram(svgEl);
  return true;
}
function fitDiagram(svgEl) {
  try {
    if (!svgEl || !svgEl.isConnected) return;
    const W = Number(svgEl.getAttribute('data-vw')) || 240, H = Number(svgEl.getAttribute('data-vh')) || 170;
    svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const bb = svgEl.getBBox(); const pad = 4;
    const x0 = Math.min(0, bb.x - pad), y0 = Math.min(0, bb.y - pad);
    const x1 = Math.max(W, bb.x + bb.width + pad), y1 = Math.max(H, bb.y + bb.height + pad);
    if (x0 < 0 || y0 < 0 || x1 > W || y1 > H) svgEl.setAttribute('viewBox', `${x0.toFixed(1)} ${y0.toFixed(1)} ${(x1 - x0).toFixed(1)} ${(y1 - y0).toFixed(1)}`);
  } catch (_) { /* not rendered yet */ }
}
function fitAllDiagrams() { document.querySelectorAll('#stage .cs-diag').forEach(fitDiagram); }
function failDiagram(svgEl) {
  if (!svgEl) return;
  const W = Number(svgEl.getAttribute('data-vw')) || 240, H = Number(svgEl.getAttribute('data-vh')) || 170, cx = W / 2, cy = H / 2;
  svgEl.innerHTML = `<rect x="${cx - 100}" y="${cy - 45}" width="200" height="90" rx="10" fill="#FFFFFF" stroke="${P.gray}" stroke-width="1.3" stroke-dasharray="5 3"></rect><text x="${cx}" y="${cy - 3}" font-size="14" fill="${P.soft}" text-anchor="middle">Diagram didn’t draw.</text><text x="${cx}" y="${cy + 17}" font-size="13" fill="${P.gray}" text-anchor="middle">Use “Redraw missing diagrams”.</text>`;
}
const slotEl = (root, key) => root.querySelector(`.cs-diag[data-k="${String(key).replace(/["\\]/g, '')}"]`);
/* mount every saved diagram; returns how many are still missing */
function mountSlots(root, d, failMissing = true) {
  let missing = 0;
  for (const s of diagramSlots(d)) {
    const el = slotEl(root, s.key), dg = (d.diagrams || {})[s.key];
    if (dg && mountDiagram(el, dg.svg)) { if (dg.alt) el.setAttribute('aria-label', dg.alt); }
    else { missing++; if (failMissing) failDiagram(el); }
  }
  return missing;
}
const d = window.DOC.data;
const stage = $('stage');
stage.innerHTML = sheetHTML(d);
mountSlots(stage, d, true);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fitAllDiagrams(); window.RENDERED = true; });
})();
</script>
